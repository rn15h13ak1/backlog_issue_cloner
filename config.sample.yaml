# ============================================================
# Backlog 課題クローンツール 設定ファイル
# ============================================================
# このファイルをコピーして config.yaml を作成してください。
# config.yaml は .gitignore で除外されています（API キーを含むため）。
#
#   cp config.sample.yaml config.yaml
#
# 依存ライブラリのインストール:
#   pip3 install pyyaml
#
# menu.py（対話メニュー）から使う場合、必要なのは下の backlog セクションだけです。
# clone セクションはメニューで指定するため省略できます。
#
# 各項目の詳細は README.md を参照してください。
# ============================================================

# ------------------------------------------------------------
# Backlog 接続設定
# ------------------------------------------------------------
backlog:
  space_host: "yourcompany.backlog.com"  # スペースのホスト名（例: myteam.backlog.com）
  api_key: "YOUR_API_KEY_HERE"           # Backlog API キー（個人設定 → API から取得）
  ssl_verify: true                       # SSL 証明書検証（オンプレ版で false にする場合あり）
  base_path: ""                          # オンプレ版のパスプレフィックス（例: "/backlog"）

  timeout: 30                            # 1 リクエストのタイムアウト秒数

  # 一時的な失敗（429 レート制限 / 5xx / 接続エラー）のリトライ設定
  # 課題の作成・更新では、サーバに届いていないことが確実な失敗（429・接続失敗）
  # のみ再試行する。詳細は README.md「エラー時のリトライ」を参照。
  max_retries: 3                         # 再試行回数（0 で無効）
  retry_backoff: 1.0                     # 初回待機秒数。以降 2 倍ずつ増える（1→2→4）
                                         # 429 で Retry-After ヘッダがあればそちらを優先
  retry_max_delay: 60.0                  # 1 回あたりの待機秒数の上限
                                         # Retry-After が極端に長い場合もここで頭打ちにする

# ------------------------------------------------------------
# クローン設定
# ------------------------------------------------------------
clone:
  # コピー元の課題キー（例: PROJ-123）
  # 親課題を指定すると、その子課題もまとめて複製されます。
  source_issue_key: "PROJ-123"

  # 新規課題の件名テンプレート（省略可）
  #   {SOURCE_SUMMARY} : コピー元課題の件名
  #   {YYYYMMDD}       : --date または今日の日付（yyyymmdd形式）
  # 例の結果: "【定期】20260409 タスク"
  #
  # この項目を省略すると「単純複製モード」になり、コピー元の件名をそのまま使って
  # 重複チェックをせずに毎回新しい課題を作ります（繰り返すたびに課題が増えます）。
  # コピー元と同じ件名で重複チェックしたい場合は "{SOURCE_SUMMARY}" と明記してください。
  summary_template: "【定期】{YYYYMMDD} タスク"

  # 作成先プロジェクトキー（省略時: コピー元課題と同じプロジェクト）
  # target_project_key: "PROJ"

  # 複製先の課題キー（省略可）
  # 指定すると件名での検索を行わず、この課題（と、その子課題）を直接更新します。
  # 既に作った課題群にコピー元の本文を反映し直したいときに使います。
  # 件名は変更されません。target_project_key とは同時に指定できません。
  # target_issue_key: "PROJ-456"

  # 種別名（省略時: プロジェクトの最初の種別）
  # Backlog プロジェクトの種別設定と一致する名前を指定してください
  # issue_type: "タスク"

  # 優先度名（省略時: "中" があれば "中"、なければ最初の優先度）
  # 利用可能な値: 最高 / 高 / 中 / 低
  # priority: "中"

  # ----------------------------------------------------------
  # 子課題の設定
  # ----------------------------------------------------------
  # 子課題もまとめて複製するか（デフォルト: true）
  # false にすると、コピー元に子課題があっても親課題だけを複製します。
  # include_children: true

  # 子課題の件名テンプレート（デフォルト: "{SOURCE_SUMMARY}"）
  #   {SOURCE_SUMMARY} : コピー元の子課題の件名
  #   {YYYYMMDD}       : --date または今日の日付
  # デフォルトではコピー元の子課題の件名をそのまま使います。
  # 例: "{YYYYMMDD} {SOURCE_SUMMARY}" → "20260909 手順1 バックアップ"
  # child_summary_template: "{SOURCE_SUMMARY}"

  # ----------------------------------------------------------
  # 重複判定の設定
  # ----------------------------------------------------------
  # 既存課題の判定方法（デフォルト: substring）
  #   substring : 既存課題の件名に summary が「含まれる」ならヒット
  #               例: 「20260828 タスク」が「20260828 タスク（再）」にもヒットする
  #   exact     : 件名の完全一致のみヒット（誤検出を避けたい場合はこちら）
  # match_mode: "substring"

  # 完了済み課題も重複判定の対象にするか（デフォルト: false）
  # false の場合、状態が「未対応 / 処理中 / 処理済み」の課題のみを検索する。
  # true にすると過去にクローズした同名課題にヒットして新規作成がスキップされる。
  # include_closed: false
